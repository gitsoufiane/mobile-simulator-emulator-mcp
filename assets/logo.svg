<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title">
  <title id="title">Mobile Simulator and Emulator MCP logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="36" fill="url(#bg)"/>
  <!-- Left phone: iOS Simulator -->
  <rect x="28" y="34" width="44" height="80" rx="10" fill="#FFFFFF"/>
  <rect x="33" y="44" width="34" height="58" rx="4" fill="#1E1B4B"/>
  <rect x="43" y="38" width="14" height="3" rx="1.5" fill="#1E1B4B"/>
  <!-- Right phone: Android Emulator -->
  <rect x="88" y="46" width="44" height="80" rx="10" fill="#FFFFFF"/>
  <rect x="93" y="54" width="34" height="58" rx="4" fill="#1E1B4B"/>
  <circle cx="110" cy="119" r="2.5" fill="#1E1B4B"/>
  <!-- Agent link between the phones -->
  <path d="M50 73 C 70 73, 90 83, 110 83" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round"/>
  <circle cx="50" cy="73" r="7" fill="#22D3EE"/>
  <circle cx="110" cy="83" r="7" fill="#22D3EE"/>
</svg>
