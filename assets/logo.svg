<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title">
  <title id="title">Mobile Simulator and Emulator MCP logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="36" fill="url(#bg)"/>
  <!-- Second device behind: more than one simulator, emulator, or phone -->
  <rect x="78" y="22" width="52" height="92" rx="13" fill="#FFFFFF" fill-opacity="0.28"/>
  <rect x="84" y="30" width="40" height="76" rx="7" fill="#1E1B4B" fill-opacity="0.22"/>
  <!-- Front phone with an app screen -->
  <rect x="34" y="38" width="62" height="104" rx="15" fill="#FFFFFF"/>
  <rect x="40" y="48" width="50" height="86" rx="8" fill="#1E1B4B"/>
  <rect x="57" y="42" width="16" height="3" rx="1.5" fill="#1E1B4B"/>
  <rect x="47" y="58" width="36" height="7" rx="3.5" fill="#818CF8"/>
  <rect x="47" y="71" width="26" height="7" rx="3.5" fill="#818CF8" fill-opacity="0.6"/>
  <rect x="47" y="84" width="31" height="7" rx="3.5" fill="#818CF8" fill-opacity="0.6"/>
  <rect x="47" y="110" width="36" height="14" rx="7" fill="#22D3EE"/>
  <!-- The agent's tap -->
  <circle cx="65" cy="117" r="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5"/>
  <circle cx="65" cy="117" r="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2.5"/>
  <circle cx="65" cy="117" r="4" fill="#FFFFFF"/>
  <!-- The AI agent that drives it -->
  <path d="M118 44 C 108 64, 92 84, 78 104" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
  <path d="M122 20 Q 124 34 138 36 Q 124 38 122 52 Q 120 38 106 36 Q 120 34 122 20 Z" fill="#FDE68A"/>
</svg>
